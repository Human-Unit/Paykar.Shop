services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paykar}
      POSTGRES_USER: ${POSTGRES_USER:-paykar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paykar_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  api:
    build: ./apps/api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-paykar}
      POSTGRES_USER: ${POSTGRES_USER:-paykar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paykar_dev}
      API_HOST: 0.0.0.0
      API_PORT: 8080
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:-}
      STORE_ADDRESS: ${STORE_ADDRESS:-Айни 16б, Душанбе, Таджикистан}
      STORE_LAT: ${STORE_LAT:-}
      STORE_LON: ${STORE_LON:-}
      DELIVERY_FLAT_PRICE: ${DELIVERY_FLAT_PRICE:-20.00}
      DELIVERY_MAX_DISTANCE_METERS: ${DELIVERY_MAX_DISTANCE_METERS:-20000}
    volumes:
      - ./db/seed:/seed:ro
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health/db', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    environment:
      API_INTERNAL_URL: http://api:8080/api/v1
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
volumes:
  postgres_data:
